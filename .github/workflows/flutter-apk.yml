name: Build Android APK

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: flutter-apk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Flutter build apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          test -f .env || cp .env.example .env
          flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Write live env for APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY secrets are not set."
            echo "The APK will keep the Demo sign-in hint."
            test -f .env || cp .env.example .env
          else
            printf 'SUPABASE_URL=%s\nSUPABASE_ANON_KEY=%s\nGOOGLE_MAPS_API_KEY=%s\n' \
              "$SUPABASE_URL" "$SUPABASE_ANON_KEY" "${GOOGLE_MAPS_API_KEY:-}" > .env
          fi

      - name: Build APK
        run: flutter build apk --release

      - name: Prepare downloadable APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/peam-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: peam-release-apk
          path: dist/peam-release.apk
          if-no-files-found: error

      - name: Publish latest APK release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Latest Android APK
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/peam-release.apk
          body: |
            Release APK from commit `${{ github.sha }}`.

            Direct download: https://github.com/${{ github.repository }}/releases/latest/download/peam-release.apk
